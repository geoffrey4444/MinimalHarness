[project]
name = "minimalharness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "h5py>=3.16.0",
    "lmstudio>=1.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.35.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Security floors for transitive dependencies: emSign trust and image decoders.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pillow>=13.0.0",
]

